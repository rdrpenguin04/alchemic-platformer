[package]
name = "alchemic-platformer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata.bevy_cli.dev]
features = ["dev"]

[package.metadata.bevy_cli.dev.native]
features = ["dev_native"]

[dependencies]
avian2d = "0.8"
bevy = { version = "0.20", features = ["bevy_dev_tools", "render_dev_tools"] }
bevy_ecs_ldtk = "0.16"
bevy-inspector-egui = "0.38"
bevy-tnua = "0.33"
bevy-tnua-avian2d = "0.13"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.154"
bevy_hanabi = "0.20.0"

[features]
dev = ["bevy/bevy_dev_tools", "bevy/render_dev_tools"]
dev_native = ["bevy/file_watcher"]

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.dev.package."*"]
opt-level = 3
debug = "full"
overflow-checks = true

[profile.dev.build-override]
opt-level = 3
debug = "limited"
